name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-chi-sim \
            libtesseract-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-html
          pip install ruff  # Linter
      
      - name: Lint with ruff
        run: |
          ruff check backend/ --output-format=github
        continue-on-error: true  # 暂时允许 lint 警告，后续可改为严格模式
      
      - name: Run tests with pytest
        run: |
          pytest backend/tests/ -v --tb=short --cov=backend --cov-report=xml --cov-report=html
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Verify imports
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import main; print('✓ main.py imports successfully')"
      
      - name: Check Dockerfile syntax
        run: |
          docker build --no-cache -t cost-prediction-app:ci-test .
          echo "✓ Dockerfile builds successfully"
      
      - name: Verify Docker image
        run: |
          docker run --rm cost-prediction-app:ci-test python -c "import sys; sys.path.insert(0, '/app/backend'); import main; print('✓ Docker image imports successfully')"
