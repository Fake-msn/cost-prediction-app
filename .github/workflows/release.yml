name: Auto Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Notes
        run: |
          VERSION_FILE="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$VERSION_FILE" ]; then
            echo "Using structured release notes: $VERSION_FILE"
            cp "$VERSION_FILE" release_notes.md
            echo "structured=true" >> $GITHUB_OUTPUT
          else
            echo "No versioned release notes found. Generating from git log."
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            echo "## Changes" > release_notes.md
            echo "" >> release_notes.md
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release." >> release_notes.md
              git log --pretty=format:"- %s" >> release_notes.md
            else
              echo "Since \`$PREV_TAG\`:" >> release_notes.md
              echo "" >> release_notes.md
              git log --pretty=format:"- %s" $PREV_TAG..HEAD >> release_notes.md
            fi
            echo "" >> release_notes.md
            echo "---" >> release_notes.md
            echo "> To provide structured release notes next time, create \`release-notes/${GITHUB_REF_NAME}.md\` before pushing the tag." >> release_notes.md
            echo "" >> release_notes.md
            echo "Auto-generated by GitHub Actions on \`$(date -u '+%Y-%m-%d %H:%M UTC')\`." >> release_notes.md
            echo "structured=false" >> $GITHUB_OUTPUT
          fi
        id: notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: ${{ steps.notes.outputs.structured == 'true' && 'false' || 'true' }}
          make_latest: true
