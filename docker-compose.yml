version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models_cache:/app/models_cache
      - ./model_config.json:/app/model_config.json
      - ./output:/app/output   # 应用日志持久化（output/app.log）
    environment:
      - PYTHONPATH=/app
      - CORS_ORIGINS=http://localhost:8000,http://localhost:3000
      # LLM API Keys (通过环境变量或.env文件配置)
      # - DASHSCOPE_API_KEY=your_key_here
      # - OPENAI_API_KEY=your_key_here
    restart: unless-stopped
    # 资源限制（M7）：防止容器无界占用宿主机资源——刻意保留上限，不做成"不限制/动态"，
    # 以免容器吃满宿主机（尤其 pandas 回退路径读超大 xlsx 时）。
    # v1.9.0：DuckDB excel 读取层使重负载链路（读取→清洗→入库）峰值仅 ≤294MB，2g 本已够用；
    # 提到 4g 为偶发的 openpyxl 回退大表导入预留余量。CPU 维持 2.0（应用为单 worker、CPU 非瓶颈）。
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # L2: 使用 127.0.0.1 而非 localhost，避免 IPv6 解析回退导致健康检查超时
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
